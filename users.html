<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Chat | Community</title><link rel="stylesheet" href="css/main.css">
<style>.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-top:20px}.user-card{text-align:center;padding:20px}.user-avatar{width:70px;height:70px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;margin-bottom:10px}</style>
</head>
<body><main class="container">
<header style="padding:20px 0;display:flex;align-items:center;gap:15px"><a href="home.html" style="color:var(--accent)">← Home</a><h2>Sky Community</h2></header>
<p style="color:var(--text-gray)">Discover members and send friend requests.</p>
<div id="userGrid" class="user-grid">Loading members…</div>
</main>
<script type="module">
import {auth,db} from './js/firebase-config.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import {collection,getDocs,limit,query} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const grid=document.getElementById('userGrid');
onAuthStateChanged(auth,async user=>{
 if(!user){location.href='login.html';return;}
 try{
  const snap=await getDocs(query(collection(db,'publicProfiles'),limit(60)));
  grid.replaceChildren();
  const members=snap.docs.filter(d=>d.id!==user.uid);
  if(!members.length){grid.textContent='No other members yet.';return;}
  members.forEach(d=>{
   const p=d.data(),card=document.createElement('article');card.className='glass-card user-card';
   const img=document.createElement('img');img.className='user-avatar';img.src=p.avatar||'';img.alt='';
   const name=document.createElement('h4');name.textContent=p.username||'Member';
   const link=document.createElement('a');link.className='btn btn-primary';link.href='user-profile.html?uid='+encodeURIComponent(d.id);link.textContent='View Profile';
   card.append(img,name,link);grid.appendChild(card);
  });
 }catch(error){console.error(error);grid.textContent='Could not load members. Check Firestore rules.';}
});
</script></body></html>
